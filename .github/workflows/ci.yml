name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  MPLBACKEND: Agg
  PYTHONWARNDEFAULTENCODING: "1"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install
        run: uv sync --locked --no-default-groups --group lint
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: mypy
        run: uv run mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04, python: "3.14", coverage: true }
          - { os: ubuntu-24.04, python: "3.15" }
          - { os: windows-2025, python: "3.12" }
          - { os: macos-15, python: "3.15" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked --no-default-groups --group test
      - name: Test
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest
      - name: Doctests
        if: ${{ matrix.coverage }}
        run: uv run --no-sync pytest --doctest-modules src/ertkit -p no:cacheprovider
      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: |
          uv run --no-sync pytest --cov --cov-report=term-missing
          uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  oldest:
    name: Oldest dependencies (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the lowest supported versions
        run: |
          uv venv --python 3.12
          uv pip install --resolution lowest-direct -e ".[plot]" --group test
          uv pip list
      - name: Test
        run: .venv/bin/python -m pytest -m "not slow"

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build
        run: uv build
      - name: Check metadata and wheel contents
        run: |
          uvx twine check --strict dist/*
          uvx check-wheel-contents dist/*.whl
      - name: Install the wheel and import it
        run: |
          uv venv /tmp/wheel-test --python 3.13
          uv pip install --python /tmp/wheel-test dist/*.whl
          /tmp/wheel-test/bin/python -c "import ertkit; v = ertkit.__version__; print(v); assert v != '0+unknown'"
