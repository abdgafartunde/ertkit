name: Docs

# The site is built for every pull request and push to main, and deployed
# when a release is published (or by a manual run), so it always matches the
# latest release.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  MPLBACKEND: Agg

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No dependency cache in a workflow that deploys (cache poisoning).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --no-default-groups --group docs --group test
      - name: Generate the verification report
        run: uv run --no-sync pytest -m verification -p no:cacheprovider --verification-report=docs/_generated/verification.json
      # Cross-reference inventories are fetched over the network and can time
      # out; a failed build is retried once, so only a real warning fails twice.
      - name: Build the site (warnings are errors)
        run: |
          uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html || {
            echo "::warning::retrying the documentation build once"
            uv run --no-sync sphinx-build -W --keep-going -E -b html docs docs/_build/html
          }
      - name: Upload the site
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
